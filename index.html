<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4c1d95" />
    <!-- O app é só no tema claro: impede o "modo escuro forçado" de Android/Samsung -->
    <meta name="color-scheme" content="only light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beauty and self" />
    <meta name="description" content="Beauty and self — veja como fica um novo corte ou uma nova cor de cabelo antes de fazer, com IA, preservando o seu rosto." />
    <title>Beauty and self</title>
  </head>
  <body>
    <div id="root">
      <noscript>
        <p style="padding: 24px; font: 17px sans-serif; text-align: center">
          Este navegador não consegue abrir o Beauty and self. Abra o link no Chrome, Safari, Samsung Internet ou
          Firefox atualizado.
        </p>
      </noscript>
    </div>
    <script>
      // Se o app não abrir (navegador muito antigo ou internet falhou), explica o que fazer
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !window.__bsStarted) {
          r.innerHTML =
            '<p style="padding:24px;font:17px sans-serif;text-align:center;color:#24123f">' +
            'O Beauty and self está demorando para abrir. Verifique a internet e toque em atualizar. ' +
            'Se não abrir, use o Chrome, Safari, Samsung Internet ou Firefox atualizado.</p>';
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
