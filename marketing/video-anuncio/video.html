<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beauty and self — Anúncio</title>
<style>
  @font-face { font-family: 'Playfair Display'; src: url('assets/fonts/PlayfairDisplay.ttf') format('truetype'); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: 'Playfair Display'; src: url('assets/fonts/PlayfairDisplay-Italic.ttf') format('truetype'); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: 'Nunito'; src: url('assets/fonts/Nunito.ttf') format('truetype'); font-weight: 200 1000; font-style: normal; }

  /* Beauty and self brand (tailwind.config.js of the app) */
  :root {
    --plum-50: #f6f2ff; --plum-100: #ede9fe; --plum-200: #ddd6fe; --plum-300: #c4b5fd; --plum-400: #a78bfa;
    --plum-500: #7c3aed; --plum-600: #6d28d9; --plum-700: #5b21b6; --plum-800: #4c1d95; --plum-900: #2e1065; --plum-950: #1a0933;
    --orchid-400: #e879f9; --orchid-500: #c026d3; --blossom-200: #fbcfe8; --blossom-300: #f9a8d4; --pollen: #f6c86b;
    --ink: #24123f; --ink-soft: #5b4a78; --paper: #fcfaff;
    --display: 'Playfair Display', Georgia, serif;
    --sans: 'Nunito', system-ui, sans-serif;
    --brand: linear-gradient(135deg, #4c1d95 0%, #6d28d9 55%, #c026d3 100%);
    --shadow-soft: 0 10px 30px -12px rgb(76 29 149 / .35);
    --shadow-lift: 0 18px 40px -16px rgb(76 29 149 / .55);
  }
  html, body { margin: 0; padding: 0; background: #111; }
  #stage { position: relative; overflow: hidden; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .brand { background: var(--brand); }
  .grad { background: linear-gradient(120deg, #5b21b6, #c026d3); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .08em; }

  .blob { position: absolute; border-radius: 50%; }
  .corner { position: absolute; transform-origin: 50% 100%; }
  #grain { position: absolute; inset: -200px; opacity: .06; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .55  0 0 0 1 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  /* headlines: Nunito extra-bold + Playfair italic accents, like the app's "Vamos descobrir o seu novo visual?" */
  .head { position: absolute; font-family: var(--sans); font-weight: 850; line-height: 1.1; letter-spacing: -0.015em; color: var(--plum-950); }
  .head .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .head .acc { font-family: var(--display); font-style: italic; font-weight: 600; letter-spacing: 0; }
  .label { position: absolute; font-family: var(--sans); font-weight: 900; text-transform: uppercase; letter-spacing: .16em; color: var(--plum-600); }

  /* hero: the client's photo, from the chair to the app and to the before/after */
  #hero { position: absolute; overflow: hidden; background: #cfcac6; }
  .look { position: absolute; }
  .look img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .look .shine { position: absolute; inset: 0; mix-blend-mode: screen; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  #heroLabel, .tile .tlabel { position: absolute; z-index: 3; left: 14px; bottom: 14px; background: rgba(255,255,255,.92); color: var(--plum-950); font-weight: 850; border-radius: 999px; white-space: nowrap; }
  #camContour, #genOverlay { position: absolute; overflow: hidden; }
  #genOverlay .tint { position: absolute; inset: 0; background: rgb(46 16 101 / .3); }
  #genOverlay .shim { position: absolute; inset: 0; }
  #genOverlay .scan { position: absolute; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, transparent, rgb(232 121 249 / .45), transparent); }

  .bubble { position: absolute; background: #fff; color: var(--plum-950); border-radius: 44px; font-family: var(--sans); font-weight: 800; white-space: nowrap;
    box-shadow: 0 24px 60px -18px rgb(76 29 149 / .4), 0 2px 6px rgb(76 29 149 / .08); }
  .bubble .tail { position: absolute; width: 44px; height: 44px; background: #fff; transform: rotate(45deg); border-radius: 6px; }
  .bubble .txt { position: relative; }
  .dots { position: absolute; display: flex; gap: 12px; align-items: center; }
  .dots i { display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--plum-500); }
  .thumb { position: absolute; border-radius: 50%; overflow: hidden; border: 6px solid #fff; box-shadow: 0 20px 44px -14px rgb(76 29 149 / .5); background: #ccc; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: block; }
  .qbadge { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: var(--brand); color: #fff; font-family: var(--display); font-style: italic; font-weight: 700; font-size: 34px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px -6px rgb(76 29 149 / .6); }
  .qchip { position: absolute; background: var(--plum-900); color: #fff; font-family: var(--sans); font-weight: 900; border-radius: 999px; white-space: nowrap; box-shadow: 0 24px 50px -16px rgb(26 9 51 / .6); }

  /* phone */
  #phone { position: absolute; width: 410px; height: 864px; transform-origin: 0 0; border-radius: 64px; background: #0c0a10;
    box-shadow: 0 0 0 2.5px #9b93a8, 0 0 0 5px #2a2433, 0 60px 120px -30px rgb(46 16 101 / .55), 0 30px 60px -30px rgb(46 16 101 / .4); }
  #screen { position: absolute; left: 10px; top: 10px; width: 390px; height: 844px; border-radius: 54px; overflow: hidden; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  .scr { position: absolute; inset: 0; overflow: hidden; }
  .island { position: absolute; left: 135px; top: 11px; width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 50; }
  .status { position: absolute; top: 15px; font-size: 15px; font-weight: 800; z-index: 49; }
  .ab { position: absolute; }
  .hdr { position: absolute; left: 0; top: 0; width: 390px; height: 111px; background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid rgb(237 233 254 / .8); z-index: 10; }
  .iconbtn { position: absolute; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .wm { font-family: var(--display); font-weight: 700; font-style: italic; letter-spacing: -0.01em; white-space: nowrap; line-height: 1; }
  .wm .and { font-weight: 600; color: var(--plum-400); -webkit-text-fill-color: var(--plum-400); }
  .modes { position: absolute; left: 16px; top: 254px; width: 358px; height: 76px; border-radius: 24px; background: rgb(237 233 254 / .7); }
  .mode { position: absolute; top: 6px; width: 110px; height: 64px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 16px; font-weight: 850; color: var(--plum-800); }
  .subtab { position: absolute; top: 342px; width: 175px; height: 48px; border-radius: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 850; }
  .subtab .n { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .search { position: absolute; left: 16px; top: 402px; width: 358px; height: 56px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 2px var(--plum-100), var(--shadow-soft); display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; font-size: 17px; font-weight: 600; color: rgb(91 74 120 / .7); white-space: nowrap; overflow: hidden; }
  .cathead { position: absolute; left: 16px; top: 476px; font-size: 19px; font-weight: 850; color: var(--plum-900); white-space: nowrap; }
  .cathead small { font-size: 14.5px; font-weight: 700; color: var(--ink-soft); }
  .card { position: absolute; width: 173px; height: 257px; border-radius: 24px; background: #fff; overflow: hidden; box-shadow: 0 0 0 1px var(--plum-100), 0 4px 16px -10px rgb(76 29 149 / .4); }
  .card .ph { position: absolute; left: 0; top: 0; width: 173px; height: 173px; background: linear-gradient(180deg, var(--plum-50), var(--plum-100)); overflow: hidden; }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .tx { position: absolute; left: 12px; right: 10px; top: 181px; display: flex; flex-direction: column; gap: 3px; }
  .card .nm { font-size: 16.5px; font-weight: 850; line-height: 1.15; color: var(--plum-950); }
  .card .ds { font-size: 13.5px; line-height: 1.3; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .sw { position: absolute; left: 8px; top: 133px; width: 32px; height: 32px; border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 4px 8px rgb(0 0 0 / .25); }
  .card .ck { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border-radius: 50%; background: var(--orchid-500); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgb(0 0 0 / .25); }
  .bar { position: absolute; left: 0; bottom: 0; width: 390px; background: rgba(255,255,255,.96); border-top: 1px solid var(--plum-100); box-shadow: 0 -12px 30px -18px rgb(76 29 149 / .5); z-index: 12; }
  .btn { position: absolute; left: 16px; width: 358px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 850; letter-spacing: .01em; box-sizing: border-box; white-space: nowrap; }
  .toggles { position: absolute; left: 16px; width: 358px; height: 60px; border-radius: 16px; background: rgb(237 233 254 / .8); }
  .toggles div { position: absolute; top: 6px; height: 48px; width: 112px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 850; color: var(--plum-700); }
  #camOverlayUI, #finger, #ripple { position: absolute; }
  #finger { width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255,255,255,.8); border: 3px solid #fff; box-shadow: 0 10px 26px rgb(26 9 51 / .4); }
  #ripple { width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 4px solid #fff; box-sizing: border-box; box-shadow: 0 0 0 2px rgb(124 58 237 / .25); }

  /* mosaic */
  .tile { position: absolute; overflow: hidden; background: #ccc; box-shadow: 0 26px 50px -22px rgb(76 29 149 / .5); }
  .tile img { position: absolute; display: block; }
  #heart { position: absolute; z-index: 10; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 34px -10px rgb(124 58 237 / .7); }

  /* before / after */
  #ba { position: absolute; overflow: hidden; background: #ccc; }
  #ba img { position: absolute; display: block; }
  #baAfter { position: absolute; inset: 0; }
  #baLine { position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -2.5px; background: #fff; box-shadow: 0 0 24px rgba(255,255,255,.9); }
  #baKnob { position: absolute; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: #fff; box-shadow: 0 12px 30px rgb(26 9 51 / .35); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .balabel { position: absolute; bottom: 26px; padding: 10px 22px; border-radius: 999px; font-weight: 900; font-size: 26px; }
  #baTint { position: absolute; inset: 0; background: var(--brand); }
  #baFlower { position: absolute; inset: 0; }

  /* end card */
  #word { position: absolute; left: 0; text-align: center; white-space: nowrap; line-height: 1.05; }
  #word .c { display: inline-block; }
  #tagline, #sub { position: absolute; left: 0; text-align: center; white-space: nowrap; }
  #cta { position: absolute; border-radius: 999px; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 14px; white-space: nowrap; box-shadow: var(--shadow-lift); }

  .spark { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; }
  .petal { position: absolute; }
  #leak { position: absolute; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgb(46 16 101 / .22) 100%); }
  #cool { position: absolute; inset: 0; background: #8f93a0; mix-blend-mode: color; }
  #coolDim { position: absolute; inset: 0; background: #5f6270; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bgLayer">
    <div class="blob" id="blob1"></div><div class="blob" id="blob2"></div><div class="blob" id="blob3"></div>
    <div class="corner" id="corner1"></div><div class="corner" id="corner2"></div>
  </div>
  <div class="layer" id="coolLayer"><div id="cool"></div><div id="coolDim"></div></div>
  <div id="phone"><div id="screen"></div></div>
  <div class="layer" id="tilesLayer"></div>
  <div id="hero"></div>
  <div id="camContour"></div>
  <div id="genOverlay"><div class="tint"></div><div class="shim"></div><div class="scan"></div></div>
  <svg id="bloom" viewBox="0 0 120 120" style="position:absolute;filter:drop-shadow(0 10px 20px rgb(26 9 51 / .45))"></svg>
  <div class="layer" id="thumbLayer"></div>
  <div class="layer" id="chipLayer"></div>
  <div id="ba">
    <img id="baBefore" alt="" />
    <div id="baAfter"><img id="baAfterImg" alt="" /></div>
    <div id="baTint"></div>
    <svg id="baFlower" viewBox="0 0 64 64"></svg>
    <div id="baLine"></div>
    <div id="baKnob">
      <svg width="16" height="26" viewBox="0 0 16 26"><path d="M12 3L3 13l9 10" fill="none" stroke="#6d28d9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg width="16" height="26" viewBox="0 0 16 26"><path d="M4 3l9 10-9 10" fill="none" stroke="#6d28d9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="balabel" id="labAntes" style="background:rgb(46 16 101 / .62); color:#fff">Antes</div>
    <div class="balabel" id="labDepois" style="background:rgba(255,255,255,.94); color:#6d28d9">Depois</div>
  </div>
  <div id="heart"><svg width="50" height="46" viewBox="0 0 24 22"><path d="M12 21s-8.5-5.3-10.6-10.1C-.2 7.3 2 3 6.1 3c2.4 0 4.2 1.4 5.9 3.6C13.7 4.4 15.5 3 17.9 3 22 3 24.2 7.3 22.6 10.9 20.5 15.7 12 21 12 21z" fill="#fff"/></svg></div>
  <div class="bubble" id="bubble1"><div class="tail"></div><div class="dots"><i></i><i></i><i></i></div><div class="txt">Não sei o que eu quero… 😅</div></div>
  <div class="bubble" id="bubble2"><div class="tail"></div><div class="txt">É esse! 😍</div></div>
  <div id="word"></div>
  <div id="tagline"></div>
  <div id="sub"></div>
  <div id="cta" class="brand"><span>Experimente no seu salão</span><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="layer" id="textLayer"></div>
  <div id="finger"></div>
  <div id="ripple"></div>
  <div class="layer" id="sparkLayer"></div>
  <div class="layer" id="petalLayer"></div>
  <div class="layer" style="overflow:hidden"><div id="leak"></div></div>
  <div id="vignette"></div>
  <div class="layer" style="overflow:hidden"><div id="grain"></div></div>
</div>

<script>
/* ------------------------------------------------------------------ */
/*  Beauty and self — anúncio (timeline determinística: window.seek)   */
/* ------------------------------------------------------------------ */
const FMT = (new URLSearchParams(location.search).get('format') || 'v').startsWith('h') ? 'h' : 'v';
const V = FMT === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const DURATION = 22.0;
const $ = (id) => document.getElementById(id);
const stage = $('stage');
stage.style.width = W + 'px';
stage.style.height = H + 'px';

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackSoft: (x) => { const c1 = 0.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const ease = (t, a, b, fn = E.outCubic) => fn(prog(t, a, b));
const env = (t, a, din, b, dout, fin = E.outCubic, fout = E.inCubic) => {
  if (t < a || t > b + dout) return 0;
  if (t < a + din) return fin(prog(t, a, a + din));
  if (t > b) return 1 - fout(prog(t, b, b + dout));
  return 1;
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const lerpRect = (a, b, k) => ({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), w: lerp(a.w, b.w, k), h: lerp(a.h, b.h, k), r: lerp(a.r ?? 0, b.r ?? 0, k) });
function place(el, r) { el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px'; if (r.r !== undefined) el.style.borderRadius = r.r + 'px'; }
function show(el, o) { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; }
function fade(el, o) { el.style.opacity = o; }
function disp(el, on) { el.style.display = on ? '' : 'none'; }
function cover(w, h, fx = 0.5, fy = 0.45, zoom = 1) {
  const side = Math.max(w, h) * zoom;
  return { x: clamp(w / 2 - fx * side, w - side, 0), y: clamp(h / 2 - fy * side, h - side, 0), w: side, h: side };
}

/* ---------- icons (same paths as the app's ui.tsx) ---------- */
const ICONS = {
  back: '<path d="M15 5 8 12l7 7"/>',
  camera: '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-1.8A2 2 0 0 1 11 3.4h2a2 2 0 0 1 1.6.8L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.6"/>',
  gallery: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-4.8-4.6a1.5 1.5 0 0 0-2.1 0L5 19.5"/>',
  scissors: '<circle cx="6.5" cy="6.5" r="2.8"/><circle cx="6.5" cy="17.5" r="2.8"/><path d="M8.6 8.4 20 18.5M8.6 15.6 20 5.5"/>',
  palette: '<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 2-.9 2-1.9 0-1.3-1-1.6-1-2.8 0-1 .8-1.8 1.8-1.8h2.1a3.6 3.6 0 0 0 3.6-3.6C20.5 6.6 16.7 3.5 12 3.5Z"/><circle cx="7.6" cy="11.4" r="1.2" fill="currentColor"/><circle cx="10" cy="7.6" r="1.2" fill="currentColor"/><circle cx="14.6" cy="7.6" r="1.2" fill="currentColor"/>',
  sparkles: '<path d="M11 3.5 12.6 8a3 3 0 0 0 1.9 1.9L19 11.5l-4.5 1.6a3 3 0 0 0-1.9 1.9L11 19.5 9.4 15a3 3 0 0 0-1.9-1.9L3 11.5l4.5-1.6A3 3 0 0 0 9.4 8z"/><path d="M18.5 3v3.5M16.8 4.8h3.5"/>',
  download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 16.5v1.5A2 2 0 0 0 6.5 20h11a2 2 0 0 0 2-2v-1.5"/>',
  share: '<path d="M12 15V4M8 7.8 12 4l4 3.8"/><path d="M8 11H6.5A2 2 0 0 0 4.5 13v5A2 2 0 0 0 6.5 20h11a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H16"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/>',
  switch: '<path d="M4 8a6 6 0 0 1 10-4.5M20 16a6 6 0 0 1-10 4.5M4 8V4M4 8h4M20 16v4M20 16h-4"/>',
};
const ic = (name, size = 24, color = 'currentColor', sw = 2) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block">${ICONS[name]}</svg>`;

const TEXTS = [];
function addHead({ id, html, tin, tout, x, y, w, size, align = 'left', stagger = 0.06, groups = null, label = null, color = null }) {
  const el = document.createElement('div');
  el.className = 'head';
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
  el.style.fontSize = size + 'px'; el.style.textAlign = align;
  if (color) el.style.color = color;
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const words = [];
  const walk = (node, cls) => {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) {
        n.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) { el.appendChild(document.createTextNode(' ')); return; }
          const s = document.createElement('span'); s.className = 'w' + (cls ? ' ' + cls : '');
          s.textContent = part; el.appendChild(s); words.push(s);
        });
      } else if (n.nodeName === 'BR') { el.appendChild(document.createElement('br')); }
      else walk(n, ((cls ? cls + ' ' : '') + (n.className || '')).trim());
    });
  };
  walk(tmp, '');
  $('textLayer').appendChild(el);
  let lab = null;
  if (label) {
    lab = document.createElement('div'); lab.className = 'label';
    lab.textContent = label.text; lab.style.fontSize = label.size + 'px';
    lab.style.left = x + 'px'; lab.style.width = w + 'px'; lab.style.textAlign = align; lab.style.top = (y - label.size * 2) + 'px';
    $('textLayer').appendChild(lab);

  TEXTS.push({ id, el, words, tin, tout, stagger, groups, lab });
}
function headsFrame(t) {

    const visible = t >= T.tin - 0.01 && t <= T.tout + 0.32;
    T.el.style.visibility = visible ? 'visible' : 'hidden';

    const out = ease(t, T.tout, T.tout + 0.3, E.inCubic);
    T.words.forEach((w, i) => {
      const start = T.groups ? T.tin + T.groups[i] : T.tin + i * T.stagger;
      const k = ease(t, start, start + 0.55, E.outExpo);

      w.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
    });
    if (T.lab) {

  }
}

const RESULT_AT = 11.2, RESULT_D = 0.62;
function heroRectAt(t) {
  if (t < 6.0) return { ...LAY.card };
  if (t < 6.85) return lerpRect(LAY.card, R.camf, ease(t, 6.0, 6.85, E.inOutCubic));
  if (t < 7.05) return { ...R.camf };
  if (t < 7.45) return lerpRect(R.camf, R.thumb, ease(t, 7.05, 7.45, E.inOutCubic));
  if (t < 7.6) return { ...R.thumb };
  if (t < 7.9) return lerpRect(R.thumb, R.thumbS, ease(t, 7.6, 7.9, E.inOutCubic));
  if (t < 9.55) return { ...R.thumbS };
  if (t < 9.95) { const k = ease(t, 9.56, 9.86, E.outCubic); return { ...R.gen, y: R.gen.y + (1 - k) * 14 * PH_S }; }
  if (t < 10.95) return { ...R.gen };
  if (t < 11.35) return lerpRect(R.gen, R.res, ease(t, 10.95, 11.35, E.inOutCubic));
  if (t < 12.25) return { ...R.res };
  if (t < 12.55) return lerpRect(R.res, R.resS, ease(t, 12.25, 12.55, E.inOutCubic));
  if (t < 13.4) return { ...R.resS };
  if (t < 14.05) return lerpRect(R.resS, HERO_TILE, ease(t, 13.4, 14.05, E.inOutCubic));
  if (t < 15.6) return { ...HERO_TILE };

}
/* parts of the hero hidden under the app header or outside the phone screen */
function heroClip(t, r) {
  if (t < 6.9 || t >= 13.4) return { top: 0, bottom: 0 };
  const header = (t >= 7.15 && t < 9.6) || (t >= 10.95 && t < 13.4);
  const limTop = header ? HEADER_BOTTOM : SCREEN_TOP;
  return { top: Math.max(0, limTop - r.y), bottom: Math.max(0, r.y + r.h - SCREEN_BOTTOM) };
}
function heroFrame(t) {
  const hero = $('hero');
  if (t >= 16.1) { disp(hero, false); show($('camContour'), 0); show($('genOverlay'), 0); return; }
  disp(hero, true);
  const r = heroRectAt(t);
  place(hero, r);
  const cl = heroClip(t, r);
  hero.style.clipPath = cl.top || cl.bottom ? `inset(${cl.top}px 0px ${cl.bottom}px 0px)` : 'none';
  hero.style.opacity = t >= 9.4 && t < 9.95 ? (t < 9.56 ? 0 : ease(t, 9.56, 9.86, E.outCubic)) : 1;
  const sc = (1.035 - 0.035 * ease(t, 0, 0.9, E.outCubic)) * (1 + 0.05 * ease(t, 15.1, 15.35, E.outBack) * (1 - ease(t, 15.6, 15.75)));
  hero.style.transform = `scale(${sc})`;
  // ring / shadow per phase
  let shadow = '0 40px 90px -30px rgb(46 16 101 / .5)';
  if (t >= 6.85 && t < 7.4) shadow = 'none';
  else if (t >= 7.4 && t < 9.6) shadow = `0 0 0 ${2 * PH_S}px #ddd6fe`;
  else if (t >= 9.6 && t < 11.0) shadow = `0 0 0 ${4 * PH_S}px rgba(255,255,255,.4), 0 30px 60px -20px rgb(26 9 51 / .7)`;
  else if (t >= 11.0 && t < 13.5) shadow = `0 0 0 ${1 * PH_S}px #ddd6fe, 0 18px 40px -16px rgb(76 29 149 / .55)`;
  else if (t >= 13.5) shadow = `0 26px 50px -22px rgb(76 29 149 / .5)${t > 15.05 ? `, 0 0 0 ${6 * ease(t, 15.05, 15.3) * (1 - ease(t, 15.6, 16.0))}px #e879f9` : ''}`;
  hero.style.boxShadow = shadow;
  const g = env(t, 4.45, 0.55, 5.8, 0.6, E.inOutSine, E.inOutSine);
  const bl = env(t, 9.6, 0.35, 10.9, 0.3, E.inOutSine, E.inOutSine);
  const f = [];
  if (g > 0.002) f.push(`grayscale(${g * 0.85}) brightness(${1 - 0.07 * g}) contrast(${1 + 0.06 * g})`);
  if (bl > 0.002) f.push(`blur(${1.5 * PH_S * bl}px) saturate(${1 - 0.25 * bl})`);
  hero.style.filter = f.length ? f.join(' ') : 'none';
  let zoom = 1 + 0.07 * ease(t, 0, 5.9, E.inOutSine);
  zoom = lerp(zoom, 1, ease(t, 6.0, 6.85, E.inOutCubic));
  const cv = cover(r.w, r.h, 0.5, 0.46, zoom);
  const p = prog(t, RESULT_AT, RESULT_AT + RESULT_D);
  const base = t >= RESULT_AT + RESULT_D ? 'ondulado-cobre' : 'natural';
  const next = t >= RESULT_AT && t < RESULT_AT + RESULT_D ? 'ondulado-cobre' : null;
  for (const id of LOOKS) {
    const L = heroLooks[id];

    L.wrap.style.display = 'block';
    place(L.wrap, cv);

    if (id === next) {

      L.wrap.style.webkitMaskImage = L.wrap.style.maskImage = `linear-gradient(180deg, #000 0%, #000 ${a}%, transparent ${a + F}%)`;
      L.shine.style.background = `linear-gradient(180deg, rgba(255,240,250,0) ${a - 3}%, rgba(255,226,246,.8) ${a + F * 0.5}%, rgba(255,240,250,0) ${a + F + 1}%)`;
      L.shine.style.opacity = Math.sin(Math.PI * clamp(p)) * 0.75;

    }

  const go = $('genOverlay');
  const gk = env(t, 9.75, 0.3, 10.85, 0.25);
  if (gk > 0.001) {
    place(go, { ...r }); show(go, gk);
    go.querySelector('.shim').style.background = `linear-gradient(100deg, transparent ${((t * 0.9) % 1) * 160 - 60}%, rgba(255,255,255,.55) ${((t * 0.9) % 1) * 160 - 30}%, transparent ${((t * 0.9) % 1) * 160}%)`;
    go.querySelector('.scan').style.top = (((t * 0.7) % 1) * 150 - 50) + '%';
  } else show(go, 0);
}

    const b = 0.55 + 0.45 * E.outBack(clamp((t - 9.6 - i * 0.06) / 0.5));
    const r = [0, 45, 90, 135, 180, 225, 270, 315][i];
    p.setAttribute('transform', `rotate(${r} 60 60) translate(60 60) scale(${b}) translate(-60 -60)`);
  });
  $('genMsg').textContent = t < 10.25 ? 'Desenhando o novo corte fio a fio…' : 'Misturando a cor perfeita…';
  $('genMsg').style.opacity = t < 10.25 ? 1 - ease(t, 10.12, 10.25) : ease(t, 10.25, 10.4);
  $('genBar').style.width = (4 + 96 * ease(t, 9.6, 10.9, (x) => 1 - Math.pow(1 - x, 2))) + '%';
  [...$('genPetals').children].forEach((el, i) => {
    const dur = 7 + (i % 5) * 1.6, delay = -(i * 1.3), left = (i * 37) % 100;
    const ph2 = (((t * 2.2 - delay) % dur) + dur) % dur / dur;
    const drift = ((i % 3) - 1) * 60 * Math.sin(ph2 * Math.PI);
    el.style.transform = `translate(${left * 3.9 + drift}px, ${ph2 * 900 - 30}px) rotate(${ph2 * (i % 2 ? 320 : -280)}deg)`;
  });
  // result screen: scroll to the buttons
  const s2 = SCROLL2 * ease(t, 12.25, 12.55, E.inOutCubic);
  $('resContent').style.transform = `translateY(${-s2}px)`;
  $('resShare').style.transform = `scale(${1 - 0.03 * env(t, 12.7, 0.05, 12.75, 0.15)})`;
  // finger
  const f = $('finger'), rp = $('ripple');
  const fin = ease(t, 6.55, 6.85) * (1 - ease(t, 13.05, 13.3));
  const hideGen = 1 - env(t, 9.56, 0.14, 12.3, 0.25);
  show(f, fin * 0.95 * hideGen);
  let pos = null, pressed = 0;
  for (let i = 0; i < TAPS.length; i++) {
    const a = TAPS[i], b = TAPS[i + 1], sa = P(a.x, a.y);
    if (i === 0 && t < a.t) { const k3 = ease(t, 6.55, a.t - 0.04, E.inOutCubic); pos = { x: lerp(sa.x + 150, sa.x, k3), y: lerp(sa.y + 240, sa.y, k3) }; break; }
    if (!b) { const k3 = ease(t, a.t + 0.15, a.t + 0.55, E.inOutCubic); pos = { x: sa.x + 130 * k3, y: sa.y + 200 * k3 }; break; }
    if (t < b.t) {
      const sb = P(b.x, b.y);
      const k3 = ease(t, Math.max(a.t + 0.12, b.t - (b.t - a.t > 1.2 ? 0.55 : b.t - a.t - 0.12)), b.t - 0.06, E.inOutCubic);
      pos = { x: lerp(sa.x, sb.x, k3), y: lerp(sa.y, sb.y, k3) + Math.sin(Math.PI * k3) * -40 };
      break;
    }
  }
  for (const tp of TAPS) { const d = t - tp.t; if (d > -0.08 && d < 0.18) pressed = Math.max(pressed, 1 - Math.abs(d - 0.02) / 0.12); }
  if (pos) { f.style.left = pos.x + 'px'; f.style.top = pos.y + 'px'; }
  f.style.transform = `scale(${1 - 0.18 * clamp(pressed)})`;
  let rk = -1, rpos = null;
  for (const tp of TAPS) { const d = t - tp.t; if (d >= 0 && d < 0.5) { rk = d / 0.5; rpos = P(tp.x, tp.y); } }
  if (rk >= 0 && !(t >= 9.58 && t < 10.0)) { show(rp, (1 - rk) * 0.9 * fin); rp.style.left = rpos.x + 'px'; rp.style.top = rpos.y + 'px'; rp.style.transform = `scale(${1 + 1.6 * E.outCubic(rk)})`; }
  else show(rp, 0);
}

/* ---------- mosaic (her results) ---------- */
const tileEls = [];
function setupTiles() {
  LAY.tileLooks.forEach((look) => {
    if (look === 'HERO') { tileEls.push(null); return; }
    const el = document.createElement('div'); el.className = 'tile';
    el.innerHTML = `<img src="${lookSrc(look)}" alt=""><div class="tlabel" style="font-size:${V ? 20 : 19}px;padding:${V ? '7px 15px' : '6px 14px'}">${TILE_LABEL[look]}</div>`;
    $('tilesLayer').appendChild(el);
    tileEls.push({ el, img: el.querySelector('img') });
  });
}
function tilesFrame(t) {
  const center = { x: R.resS.x + R.resS.w / 2, y: R.resS.y + R.resS.h / 2 };
  tileEls.forEach((T, i) => {
    if (!T) return;
    if (t < 13.4 || t > 16.0) { T.el.style.visibility = 'hidden'; return; }
    T.el.style.visibility = 'visible';
    const tr = tileRect(i);
    const d = Math.hypot(tr.x + tr.w / 2 - HERO_TILE.x - HERO_TILE.w / 2, tr.y + tr.h / 2 - HERO_TILE.y - HERO_TILE.h / 2);
    const tin = 13.75 + d / 2600;
    const k = ease(t, tin, tin + 0.7, E.outBackSoft);
    const from = { x: HERO_TILE.x + HERO_TILE.w / 2, y: HERO_TILE.y + HERO_TILE.h / 2 };
    const rr = rng(i * 99 + 3), rot0 = (rr() - 0.5) * 24;
    const x = lerp(from.x - tr.w / 2, tr.x, k);
    let y = lerp(from.y - tr.h / 2, tr.y, k) + Math.sin(t * 1.6 + i) * 5 * ease(t, tin + 0.6, tin + 1.2, E.inOutSine);
    const fadeOut = ease(t, 15.45, 15.9, E.inCubic);
    place(T.el, { x, y, w: tr.w, h: tr.h, r: tr.r });
    T.el.style.opacity = clamp(k * 2) * (1 - fadeOut);
    T.el.style.transform = `scale(${lerp(0.35, 1, clamp(k)) * (1 - 0.08 * fadeOut)}) rotate(${rot0 * (1 - clamp(k))}deg)`;
    T.el.style.filter = fadeOut > 0.01 ? `blur(${6 * fadeOut}px)` : 'none';
    place(T.img, cover(tr.w, tr.h, 0.5, 0.46, 1));
  });
  const hEl = $('heart');
  const hk = env(t, 15.08, 0.45, 15.55, 0.2, E.outBack, E.inCubic);
  show(hEl, clamp(hk * 1.5));
  hEl.style.left = (HERO_TILE.x + HERO_TILE.w - 16) + 'px'; hEl.style.top = (HERO_TILE.y + 16) + 'px';
  hEl.style.transform = `scale(${0.2 + 0.8 * hk}) rotate(${(1 - hk) * -20}deg)`;
}

/* ---------- before / after, then it becomes the app icon ---------- */

  $('labAntes').style.left = '26px';
  $('labDepois').style.right = '26px';

}
function baFrame(t) {

  const m = ease(t, 18.5, 19.1, E.inOutCubic);

  const icon = { x: L.cx - L.s / 2, y: L.cy - L.s / 2, w: L.s, h: L.s, r: L.s * 0.25 };
  const r = lerpRect(LAY.ba, icon, m);
  place(ba, r);
  ba.style.transform = `scale(${1 + 0.02 * Math.sin((t - 19.2) * 2.2) * ease(t, 19.8, 20.4)})`;
  const cv = cover(r.w, r.h, 0.5, 0.46, 1);
  place($('baBefore'), cv); place($('baAfterImg'), cv);
  let D = 0;

  else if (t < 16.95) D = lerp(0, 80, ease(t, 16.2, 16.95, E.inOutCubic));
  else if (t < 17.6) D = lerp(80, 30, ease(t, 16.95, 17.6, E.inOutCubic));
  else D = lerp(30, 52, ease(t, 17.6, 18.2, E.inOutCubic));

  const ui = ease(t, 16.1, 16.3) * (1 - ease(t, 18.35, 18.55, E.inCubic));

  const kn = $('baKnob'); kn.style.left = D + '%'; kn.style.top = '52%'; fade(kn, ui); kn.style.transform = `scale(${0.6 + 0.4 * ui})`;
  const lk = ease(t, 16.25, 16.6) * (1 - ease(t, 18.35, 18.55, E.inCubic));
  fade($('labAntes'), lk * clamp((D - 8) / 10)); fade($('labDepois'), lk * clamp((92 - D) / 10));
  fade($('baTint'), ease(t, 18.62, 18.98, E.inOutSine));

  // the flower of the app icon blooms inside

  fl.querySelectorAll('.fp').forEach((p, i) => {
    const k = E.outBack(clamp((t - 19.0 - i * 0.07) / 0.45));

  });
  $('fpC').setAttribute('r', 6.5 * E.outBack(clamp((t - 19.25) / 0.35)));
  $('baFlowerG').setAttribute('transform', `translate(32 32) rotate(${(t - 19) * 8})`);

/* ---------- end card ---------- */

function endFrame(t) {
  const word = $('word');
  word.style.visibility = t >= 19.1 ? 'visible' : 'hidden';
  const chars = [...word.children], n = chars.length;
  const sh = prog(t, 20.85, 21.75);
  chars.forEach((c, i) => {
    const a = 19.2 + i * 0.04, k = ease(t, a, a + 0.6, E.outExpo);
    c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 50}px)`;
    c.style.filter = k < 0.98 ? `blur(${(1 - k) * 10}px)` : 'none';
    // shimmer: brighten each letter as the light passes
    const pos = lerp(-0.3, 1.3, E.inOutSine(sh));

    c.style.textShadow = f > 0.01 ? `0 0 ${24 * f}px rgba(232,121,249,${0.9 * f})` : 'none';
  });
  const tg = $('tagline'), tk = ease(t, 19.8, 20.35, E.outExpo);
  show(tg, tk); tg.style.transform = `translateY(${(1 - tk) * 40}px)`; tg.style.filter = tk < 0.98 ? `blur(${(1 - tk) * 8}px)` : 'none';

/* ---------- sparkles + petals ---------- */
const SPARK_POOL = [];
const SPARK_SVG = '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 0 C21.5 13 27 18.5 40 20 C27 21.5 21.5 27 20 40 C18.5 27 13 21.5 0 20 C13 18.5 18.5 13 20 0Z" fill="FILL"/></svg>';
function setupSparks() {
  const fills = ['#ffffff', '#f6c86b', '#f9a8d4', '#e879f9'];
  for (let i = 0; i < 64; i++) {
    const el = document.createElement('div'); el.className = 'spark';
    el.innerHTML = SPARK_SVG.replace('FILL', fills[i % 4]);
    $('sparkLayer').appendChild(el); SPARK_POOL.push(el);
  }
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div'); el.className = 'petal';
    const size = (V ? 22 : 18) + ((i * 7) % 16);
    el.innerHTML = `<svg width="${size}" height="${size * 1.3}" viewBox="0 0 10 13"><path d="M5 0 C 9 3, 10 9, 5 13 C 0 9, 1 3, 5 0Z" fill="${['#f9a8d4', '#e879f9', '#c4b5fd', '#fbcfe8'][i % 4]}" opacity=".85"/></svg>`;
    $('petalLayer').appendChild(el);
  }
}
let BURSTS = [];
function sparkBursts() {
  const B = [];
  B.push({ t: 6.35, ...R.camf, x: R.camf.x - 40, y: R.camf.y - 40, w: R.camf.w + 80, h: R.camf.h + 80, n: 10, seed: 1, edge: true });
  B.push({ t: RESULT_AT + 0.1, x: R.res.x + R.res.w * 0.1, y: R.res.y + R.res.h * 0.05, w: R.res.w * 0.8, h: R.res.h * 0.75, n: 14, seed: 11 });
  B.push({ t: 15.1, x: HERO_TILE.x - 30, y: HERO_TILE.y - 30, w: HERO_TILE.w + 60, h: HERO_TILE.h + 60, n: 9, seed: 30, edge: true });
  const b2 = $('bubble2');
  B.push({ t: 17.15, x: parseFloat(b2.style.left) - 40, y: parseFloat(b2.style.top) - 50, w: 420, h: 220, n: 9, seed: 40 });
  const L = LAY.logo;
  for (const [tt, n, seed] of [[19.1, 14, 50], [20.3, 10, 60], [21.2, 8, 70]])
    B.push({ t: tt, x: L.cx - L.s * 1.4, y: L.cy - L.s * 0.85, w: L.s * 2.8, h: L.s * 1.7, n, seed, edge: true });
  return B;
}
function sparksFrame(t) {
  let used = 0;
  for (const b of BURSTS) {
    if (t < b.t - 0.01 || t > b.t + 1.6) continue;
    const r = rng(b.seed * 7919);
    for (let i = 0; i < b.n && used < SPARK_POOL.length; i++) {
      let px = r(), py = r();
      if (b.edge) { const side = Math.floor(r() * 4); if (side === 0) py = r() * 0.15; else if (side === 1) py = 0.85 + r() * 0.15; else if (side === 2) px = r() * 0.12; else px = 0.88 + r() * 0.12; }
      const delay = r() * 0.6, life = 0.6 + r() * 0.5, size = 0.5 + r() * 0.9, spin = (r() - 0.5) * 180;
      const lt = (t - b.t - delay) / life;
      if (lt < 0 || lt > 1) continue;
      const el = SPARK_POOL[used++];
      el.style.visibility = 'visible'; el.style.opacity = Math.min(1, Math.sin(Math.PI * lt) * 1.4);
      el.style.left = (b.x + px * b.w) + 'px'; el.style.top = (b.y + py * b.h - lt * 20) + 'px';
      el.style.transform = `scale(${Math.sin(Math.PI * lt) * size}) rotate(${spin * lt}deg)`;
    }
  }
  for (let i = used; i < SPARK_POOL.length; i++) SPARK_POOL[i].style.visibility = 'hidden';
  // a soft rain of petals over the end card
  const pk = ease(t, 19.0, 19.8);
  [...$('petalLayer').children].forEach((el, i) => {
    if (pk <= 0) { el.style.visibility = 'hidden'; return; }
    el.style.visibility = 'visible';
    const dur = 5 + (i % 5) * 0.9, left = ((i * 37) % 100) / 100;
    const ph2 = ((t - 19.0 + i * 0.37) % dur) / dur;
    const x = left * W + ((i % 3) - 1) * 70 * Math.sin(ph2 * Math.PI * 1.5);
    el.style.opacity = pk * 0.85 * Math.sin(Math.PI * ph2);
    el.style.transform = `translate(${x}px, ${ph2 * (H + 80) - 60}px) rotate(${ph2 * (i % 2 ? 300 : -260)}deg)`;
  });
}
const LEAKS = [{ t: 5.85, d: 1.1 }, { t: 13.35, d: 0.9 }, { t: 15.45, d: 0.85 }, { t: 18.45, d: 1.0 }];
function leakFrame(t) {
  const el = $('leak'), S = Math.max(W, H) * 1.6;
  el.style.width = S + 'px'; el.style.height = S * 0.5 + 'px';
  let on = null;
  for (const L of LEAKS) if (t >= L.t && t <= L.t + L.d) on = L;
  if (!on) { el.style.visibility = 'hidden'; return; }
  const k = (t - on.t) / on.d;
  el.style.visibility = 'visible';
  el.style.background = 'linear-gradient(90deg, rgba(240,200,255,0) 0%, rgba(232,121,249,.45) 35%, rgba(251,207,232,.75) 50%, rgba(196,181,253,.45) 65%, rgba(240,200,255,0) 100%)';
  el.style.opacity = Math.sin(Math.PI * k) * 0.5;
  el.style.transform = `translate(${lerp(-S * 0.75, W - S * 0.2, E.inOutSine(k))}px, ${H / 2 - S * 0.25}px) rotate(-24deg)`;
  el.style.filter = 'blur(30px)';
}

/* ---------- main ---------- */
function seek(t) {
  t = clamp(t, 0, DURATION);
  bgFrame(t); headsFrame(t); heroFrame(t); bubblesFrame(t); thumbsFrame(t); chipsFrame(t);
  phoneFrame(t); tilesFrame(t); baFrame(t); endFrame(t); sparksFrame(t); leakFrame(t);
}
async function init() {
  setupBg(); setupTexts(); setupHero(); setupBubbles(); setupThumbs(); setupChips(); setupPhone(); setupTiles(); setupBA(); setupEnd(); setupSparks();
  BURSTS = sparkBursts();
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete && im.naturalWidth ? Promise.resolve() : im.decode().catch(() => {}))));
  await Promise.all(LOOKS.map((id) => new Promise((res) => { const im = new Image(); im.onload = im.onerror = res; im.src = maskSrc(id); })));
  seek(0);
  window.__ready = true;
}
window.seek = seek;
window.DURATION = DURATION;
window.FORMAT = { W, H, FMT };
init();

/* preview: video.html?play=1 (or &format=h) plays it live in a browser */
if (new URLSearchParams(location.search).get('play')) {
  const t0 = performance.now();
  const loop = () => { if (window.__ready) seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
