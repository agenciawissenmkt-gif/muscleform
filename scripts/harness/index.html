<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hair cutout extractor</title>
  </head>
  <body>
    <canvas id="output"></canvas>
    <script type="module">
      import {
        FilesetResolver,
        ImageSegmenter,
        FaceLandmarker,
      } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

      // If the CDN is flaky on your network, vendor the files locally once
      // (see scripts/harness/README.md) and swap the import + paths below to
      // './vendor/...' instead.

      const HAIR = 1;
      const FACE_SKIN = 3;
      const LEFT_TEMPLE = 234;
      const RIGHT_TEMPLE = 454;
      const FOREHEAD_TOP = 10;

      async function run() {
        const params = new URLSearchParams(location.search);
        const src = params.get('src');
        const dilate = parseFloat(params.get('dilate') || '1.06');

        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm',
        );
        const segmenter = await ImageSegmenter.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite',
            delegate: 'CPU',
          },
          runningMode: 'IMAGE',
          outputCategoryMask: true,
          outputConfidenceMasks: false,
        });

        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = src;
        });

        const w = img.naturalWidth;
        const h = img.naturalHeight;

        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = w;
        srcCanvas.height = h;
        const srcCtx = srcCanvas.getContext('2d');
        srcCtx.drawImage(img, 0, 0);

        const landmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task',
            delegate: 'CPU',
          },
          runningMode: 'IMAGE',
          numFaces: 1,
        });
        const faceResult = landmarker.detect(srcCanvas);
        const lm = faceResult.faceLandmarks?.[0];
        let anchor = null;
        if (lm) {
          const left = lm[LEFT_TEMPLE];
          const right = lm[RIGHT_TEMPLE];
          const forehead = lm[FOREHEAD_TOP];
          anchor = {
            faceWidth: Math.hypot(right.x - left.x, right.y - left.y),
            foreheadX: forehead.x,
            foreheadY: forehead.y,
          };
        }
        window.__anchor = anchor;

        const result = segmenter.segment(srcCanvas);
        const mask = result.categoryMask;
        const maskData = mask.getAsUint8Array();
        const mw = mask.width;
        const mh = mask.height;

        // Build hair alpha at mask resolution, then upscale+blur for smooth edges.
        // Keep only the largest connected blob of HAIR pixels (flood fill),
        // so isolated misclassified specks (shadows, background noise) don't
        // survive into a permanently-baked static asset the way they would
        // self-correct frame-to-frame in the live video path.
        const isHair = new Uint8Array(mw * mh);
        for (let i = 0; i < mw * mh; i++) isHair[i] = maskData[i] === HAIR ? 1 : 0;

        const visited = new Uint8Array(mw * mh);
        const stack = new Int32Array(mw * mh);
        let bestComponent = null;
        let bestSize = 0;
        for (let start = 0; start < mw * mh; start++) {
          if (!isHair[start] || visited[start]) continue;
          let sp = 0;
          stack[sp++] = start;
          visited[start] = 1;
          const component = [];
          while (sp > 0) {
            const idx = stack[--sp];
            component.push(idx);
            const x = idx % mw;
            const y = (idx / mw) | 0;
            const neighbors = [idx - 1, idx + 1, idx - mw, idx + mw];
            for (const n of neighbors) {
              if (n < 0 || n >= mw * mh || visited[n] || !isHair[n]) continue;
              const nx = n % mw;
              if (Math.abs(nx - x) > 1) continue; // avoid wrap-around on row edges
              visited[n] = 1;
              stack[sp++] = n;
            }
          }
          if (component.length > bestSize) {
            bestSize = component.length;
            bestComponent = component;
          }
        }

        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = mw;
        maskCanvas.height = mh;
        const maskCtx = maskCanvas.getContext('2d');
        const maskImg = maskCtx.createImageData(mw, mh);
        let minX = mw, maxX = 0, minY = mh, maxY = 0;
        const hairPixels = bestComponent ? bestComponent.length : 0;
        for (const idx of bestComponent || []) {
          const x = idx % mw;
          const y = (idx / mw) | 0;
          const p = idx * 4;
          maskImg.data[p] = 255;
          maskImg.data[p + 1] = 255;
          maskImg.data[p + 2] = 255;
          maskImg.data[p + 3] = 255;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
        maskCtx.putImageData(maskImg, 0, 0);

        const blurCanvas = document.createElement('canvas');
        blurCanvas.width = w;
        blurCanvas.height = h;
        const blurCtx = blurCanvas.getContext('2d');
        blurCtx.filter = 'blur(2px)';
        blurCtx.drawImage(maskCanvas, 0, 0, mw, mh, 0, 0, w, h);
        blurCtx.filter = 'none';

        // Face-skin protection: never let the hair cutout include face pixels,
        // even with the blur/dilation margin.
        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = mw;
        faceCanvas.height = mh;
        const faceCtx = faceCanvas.getContext('2d');
        const faceImg = faceCtx.createImageData(mw, mh);
        for (let y = 0; y < mh; y++) {
          for (let x = 0; x < mw; x++) {
            const idx = y * mw + x;
            const p = idx * 4;
            if (maskData[idx] === FACE_SKIN) {
              faceImg.data[p] = 255;
              faceImg.data[p + 1] = 255;
              faceImg.data[p + 2] = 255;
              faceImg.data[p + 3] = 255;
            }
          }
        }
        faceCtx.putImageData(faceImg, 0, 0);
        const blurFaceCanvas = document.createElement('canvas');
        blurFaceCanvas.width = w;
        blurFaceCanvas.height = h;
        const blurFaceCtx = blurFaceCanvas.getContext('2d');
        blurFaceCtx.drawImage(faceCanvas, 0, 0, mw, mh, 0, 0, w, h);

        // Final cutout: original photo pixels, alpha = hair mask, minus face.
        const outCanvas = document.getElementById('output');
        outCanvas.width = w;
        outCanvas.height = h;
        const outCtx = outCanvas.getContext('2d');
        outCtx.drawImage(srcCanvas, 0, 0);
        outCtx.globalCompositeOperation = 'destination-in';
        outCtx.drawImage(blurCanvas, 0, 0);
        outCtx.globalCompositeOperation = 'destination-out';
        outCtx.drawImage(blurFaceCanvas, 0, 0);
        outCtx.globalCompositeOperation = 'source-over';

        window.__bbox = {
          minX: minX / mw, maxX: maxX / mw, minY: minY / mh, maxY: maxY / mh, hairPixels,
        };
        window.__resultDataUrl = outCanvas.toDataURL('image/png');
        window.__done = true;
      }

      run().catch((err) => {
        window.__error = String(err && err.stack || err);
        window.__done = true;
      });
    </script>
  </body>
</html>
